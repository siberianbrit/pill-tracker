<!DOCTYPE html>

<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="theme-color" content="#f4f0e8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Pill Tracker">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon-180.png">

    <meta

        name="viewport"

        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"

    >

    <title>Pill Tracker</title>



    <style>

        /* ========================================

           COLORS

        ======================================== */

        :root {

            --bg: #f4f0e8;

            --card: #faf8f3;

            --card-soft: #eee9df;

            --text: #24231f;

            --secondary: #89857b;

            --border: #ded8cc;

            --accent: #96937a;

            --accent-dark: #77745f;

        }



        /* ========================================

           GENERAL

        ======================================== */

        * {

            box-sizing: border-box;

            -webkit-tap-highlight-color: transparent;

        }



        body {

            margin: 0;

            background: var(--bg);

            color: var(--text);

            font-family:

                -apple-system,

                BlinkMacSystemFont,

                "SF Pro Display",

                "SF Pro Text",

                "Segoe UI",

                sans-serif;

            min-height: 100vh;

        }



        button,

        input,

        select,

        textarea {

            font-family: inherit;

        }



        button {

            cursor: pointer;

        }



        /* ========================================

           APP

        ======================================== */

        .app {

            width: 100%;

            max-width: 480px;

            min-height: 100vh;

            margin: 0 auto;

            padding:

                24px

                20px

                110px;

        }



        /* ========================================

           TOP BAR

        ======================================== */

        .top-bar {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 30px;

        }



        .menu-button,

        .notification-button {

            width: 42px;

            height: 42px;

            border: none;

            border-radius: 50%;

            background: transparent;

            color: var(--text);

            font-size: 22px;

            display: flex;

            align-items: center;

            justify-content: center;

        }



        .notification-button {

            font-size: 19px;

        }



        /* ========================================

           HEADER

        ======================================== */

        .header {

            margin-bottom: 22px;

        }



        .date {

            color: var(--secondary);

            font-size: 15px;

            font-weight: 500;

            margin-bottom: 5px;

        }



        h1 {

            margin: 0;

            font-size: 38px;

            line-height: 1.05;

            letter-spacing: -1.5px;

        }



        /* ========================================

           PROGRESS CARD

        ======================================== */

        .progress-card {

            background: var(--card);

            border-radius: 26px;

            padding: 23px;

            margin-bottom: 22px;

            border:

                1px solid rgba(0,0,0,0.025);

        }



        .progress-label {

            color: var(--secondary);

            font-size: 15px;

            margin-bottom: 8px;

        }



        .progress-number {

            font-size: 30px;

            font-weight: 650;

            letter-spacing: -1px;

        }



        .progress-percent {

            color: var(--secondary);

            font-size: 15px;

            margin-top: 3px;

        }



        .progress-bar {

            width: 100%;

            height: 8px;

            background: #dfdbd1;

            border-radius: 20px;

            overflow: hidden;

            margin-top: 16px;

        }



        .progress-fill {

            width: 0%;

            height: 100%;

            background: var(--accent);

            border-radius: 20px;

            transition: width 0.35s ease;

        }



        /* ========================================

           MEDICINE CARDS

        ======================================== */

        .medicine-card {

            background: var(--card);

            border-radius: 24px;

            padding: 17px;

            margin-bottom: 12px;

            display: flex;

            align-items: center;

            gap: 15px;

            border:

                1px solid rgba(0,0,0,0.025);

            transition:

                transform 0.2s,

                opacity 0.2s;

        }



        .medicine-card.completed {

            opacity: 0.62;

        }



        .medicine-icon {

            width: 58px;

            height: 58px;

            flex-shrink: 0;

            border-radius: 50%;

            background: #ebe5d9;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 28px;

        }



        .medicine-info {

            flex: 1;

            min-width: 0;

        }



        .medicine-time {

            color: var(--secondary);

            font-size: 13px;

            margin-bottom: 3px;

        }



        .medicine-name {

            font-size: 19px;

            font-weight: 650;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

        }



        .medicine-dose {

            color: var(--secondary);

            font-size: 14px;

            margin-top: 4px;

        }



        .medicine-food {

            color: var(--secondary);

            font-size: 13px;

            margin-top: 5px;

        }



        /* ========================================

           TAKE BUTTON

        ======================================== */

        .take-button {

            flex-shrink: 0;

            min-width: 82px;

            padding: 10px 14px;

            border-radius: 13px;

            border: 1px solid var(--border);

            background: transparent;

            color: var(--text);

            font-size: 14px;

            font-weight: 600;

        }



        .take-button.completed-button {

            width: 40px;

            min-width: 40px;

            height: 40px;

            padding: 0;

            border: none;

            background: var(--accent);

            color: white;

            border-radius: 50%;

            font-size: 18px;

        }



        /* ========================================

           ADD BUTTON

        ======================================== */

        .add-button {

            width: 100%;

            border: none;

            background: var(--accent);

            color: white;

            border-radius: 18px;

            padding: 15px;

            margin-top: 8px;

            font-size: 16px;

            font-weight: 600;

        }



        .add-button:active {

            transform: scale(0.98);

        }



        /* ========================================

           EMPTY

        ======================================== */

        .empty {

            text-align: center;

            color: var(--secondary);

            padding: 45px 20px;

        }



        /* ========================================

           BOTTOM NAVIGATION

        ======================================== */

        .bottom-nav {

            position: fixed;

            bottom: 0;

            left: 50%;

            transform: translateX(-50%);

            width: 100%;

            max-width: 480px;

            padding:

                10px

                20px

                calc(

                    10px +

                    env(safe-area-inset-bottom)

                );

            background:

                rgba(244, 240, 232, 0.92);

            backdrop-filter: blur(18px);

            -webkit-backdrop-filter: blur(18px);

            border-top:

                1px solid rgba(0,0,0,0.04);

            display: flex;

            justify-content: space-around;

        }



        .nav-button {

            background: transparent;

            border: none;

            color: var(--secondary);

            font-size: 12px;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 4px;

            padding: 5px 20px;

        }



        .nav-button.active {

            color: var(--text);

        }



        .nav-icon {

            font-size: 20px;

        }



        /* ========================================

           HISTORY

        ======================================== */

        .history-screen {

            display: none;

        }



        .history-header {

            margin-bottom: 22px;

        }



        .history-title {

            font-size: 32px;

            font-weight: 650;

            letter-spacing: -1px;

        }



        .history-subtitle {

            color: var(--secondary);

            font-size: 14px;

            margin-top: 5px;

        }



        .history-tabs {

            display: flex;

            background: #e9e4da;

            padding: 4px;

            border-radius: 14px;

            margin-bottom: 20px;

        }



        .history-tab {

            flex: 1;

            border: none;

            background: transparent;

            color: var(--secondary);

            padding: 9px 5px;

            border-radius: 11px;

            font-size: 13px;

            font-weight: 550;

        }



        .history-tab.active {

            background: var(--card);

            color: var(--text);

            box-shadow:

                0 1px 4px rgba(0,0,0,0.05);

        }



        .history-day {

            margin-bottom: 25px;

        }



        .history-day-title {

            color: var(--secondary);

            font-size: 13px;

            font-weight: 600;

            text-transform: uppercase;

            letter-spacing: 0.5px;

            margin-bottom: 9px;

            padding-left: 4px;

        }



        .history-item {

            background: var(--card);

            border-radius: 18px;

            padding: 14px;

            margin-bottom: 8px;

            display: flex;

            align-items: center;

            gap: 13px;

        }



        .history-icon {

            width: 46px;

            height: 46px;

            border-radius: 50%;

            background: #ebe5d9;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 23px;

            flex-shrink: 0;

        }



        .history-info {

            flex: 1;

            min-width: 0;

        }



        .history-time {

            color: var(--secondary);

            font-size: 12px;

            margin-bottom: 3px;

        }



        .history-name {

            font-size: 16px;

            font-weight: 600;

        }



        .history-dose {

            color: var(--secondary);

            font-size: 13px;

            margin-top: 3px;

        }



        .history-status {

            width: 30px;

            height: 30px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 14px;

        }



        .history-status.taken {

            background: var(--accent);

            color: white;

        }



        .history-status.missed {

            background: #e5dfd4;

            color: var(--secondary);

        }



        .history-empty {

            text-align: center;

            color: var(--secondary);

            padding: 45px 20px;

        }



        /* ========================================

           MODAL

        ======================================== */

        /* STATISTICS */
        .statistics-screen{display:none;}
        .statistics-header{margin-bottom:22px;}
        .statistics-title{font-size:32px;font-weight:650;letter-spacing:-1px;}
        .statistics-subtitle{color:var(--secondary);font-size:14px;margin-top:5px;}
        .stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:22px;}
        .stat-card{background:var(--card);border-radius:22px;padding:18px;}
        .stat-card-label{color:var(--secondary);font-size:13px;margin-bottom:7px;}
        .stat-card-value{font-size:27px;font-weight:650;letter-spacing:-.8px;}
        .stat-card-detail{color:var(--secondary);font-size:12px;margin-top:4px;}
        .stats-section-title{font-size:18px;font-weight:650;margin:24px 0 10px;}
        .medicine-stat{background:var(--card);border-radius:20px;padding:15px;margin-bottom:9px;display:flex;align-items:center;gap:12px;}
        .medicine-stat-icon{width:44px;height:44px;border-radius:50%;background:#ebe5d9;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
        .medicine-stat-info{flex:1;min-width:0;}
        .medicine-stat-name{font-size:15px;font-weight:600;}
        .medicine-stat-detail{color:var(--secondary);font-size:12px;margin-top:4px;}
        .medicine-stat-percent{font-size:16px;font-weight:650;}
        .stat-progress{height:5px;background:#dfdbd1;border-radius:10px;overflow:hidden;margin-top:8px;}
        .stat-progress-fill{height:100%;background:var(--accent);border-radius:10px;}

        .modal {

            display: none;

            position: fixed;

            inset: 0;

            z-index: 100;

            background:

                rgba(40,38,33,0.28);

            align-items: flex-end;

            justify-content: center;

        }



        .modal.active {

            display: flex;

        }



        .modal-content {

            width: 100%;

            max-width: 480px;

            max-height: 92vh;

            overflow-y: auto;

            background: #faf8f3;

            border-radius:

                28px 28px 0 0;

            padding:

                22px

                20px

                35px;

            animation:

                slideUp 0.25s ease;

        }



        @keyframes slideUp {

            from {

                transform:

                    translateY(100%);

            }

            to {

                transform:

                    translateY(0);

            }

        }



        .modal-handle {

            width: 42px;

            height: 4px;

            background: #d5d0c6;

            border-radius: 10px;

            margin:

                0 auto 22px;

        }



        .modal-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;

        }



        .modal-title {

            margin: 0;

            font-size: 27px;

            letter-spacing: -0.7px;

        }



        .close-button {

            width: 38px;

            height: 38px;

            border: none;

            background: #eeeae2;

            border-radius: 50%;

            font-size: 22px;

            color: var(--text);

        }



        /* ========================================

           FORM

        ======================================== */

        .field {

            margin-bottom: 20px;

        }



        .field-label {

            display: block;

            font-size: 14px;

            font-weight: 550;

            margin-bottom: 8px;

        }



        input,

        select,

        textarea {

            width: 100%;

            padding: 14px 15px;

            border:

                1px solid var(--border);

            background: #fbfaf7;

            border-radius: 14px;

            font-size: 16px;

            color: var(--text);

            outline: none;

        }



        input:focus,

        select:focus,

        textarea:focus {

            border-color:

                var(--accent);

        }



        textarea {

            min-height: 90px;

            resize: vertical;

        }



        /* ========================================

           ICON PICKER

        ======================================== */

        .icon-grid {

            display: grid;

            grid-template-columns:

                repeat(4, 1fr);

            gap: 9px;

        }



        .icon-option {

            aspect-ratio: 1;

            border-radius: 16px;

            border:

                1px solid var(--border);

            background: #fbfaf7;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 28px;

            transition:

                border 0.15s,

                *background* 0.15s;

        }



        .icon-option.selected {

            border:

                2px solid var(--accent-dark);

            background: #eee9df;

        }



        /* ========================================

           SCHEDULE

        ======================================== */

        .schedule-container {

            display: flex;

            flex-direction: column;

            gap: 10px;

        }



        .schedule {

            background: #eee9df;

            border-radius: 18px;

            padding: 14px;

        }



        .schedule-top {

            display: flex;

            align-items: center;

            gap: 8px;

        }



        .schedule-time {

            flex: 1;

        }



        .schedule-amount {

            width: 70px;

        }



        .unit {

            color: var(--secondary);

            font-size: 13px;

        }



        .remove-schedule {

            width: 34px;

            height: 34px;

            border: none;

            background: transparent;

            color: var(--secondary);

            font-size: 20px;

        }



        .schedule-food {

            margin-top: 10px;

        }



        .add-schedule {

            width: 100%;

            padding: 13px;

            border-radius: 14px;

            border:

                1px dashed var(--border);

            background: transparent;

            color: var(--text);

            font-size: 14px;

            font-weight: 550;

        }



        /* ========================================

           MODAL BUTTONS

        ======================================== */

        .save-button {

            width: 100%;

            border: none;

            background: var(--accent);

            color: white;

            border-radius: 16px;

            padding: 15px;

            font-size: 16px;

            font-weight: 600;

            margin-top: 22px;

        }



        .cancel-button {

            width: 100%;

            border: none;

            background: transparent;

            color: var(--secondary);

            padding: 14px;

            font-size: 15px;

        }

    </style>

</head>



<body>



<div class="app">



    <!-- =====================================

         TOP BAR

    ====================================== -->

    <div class="top-bar">

        <button class="menu-button">

            ☰

        </button>



        <div style="flex:1"></div>



        <button class="notification-button">

            ♧

        </button>

    </div>



    <!-- =====================================

         HEADER

    ====================================== -->

    <div class="header">

        <div

            class="date"

            id="currentDate">

        </div>



        <h1>

            Сегодня

        </h1>

    </div>



    <!-- =====================================

         PROGRESS

    ====================================== -->

    <div

        class="progress-card"

        id="progressCard">

        <div class="progress-label">

            Сегодня принято

        </div>



        <div class="progress-number">

            <span id="takenCount">

                0

            </span>

            /

            <span id="totalCount">

                0

            </span>

        </div>



        <div

            class="progress-percent"

            id="progressPercent">

            0%

        </div>



        <div class="progress-bar">

            <div

                class="progress-fill"

                id="progressFill">

            </div>

        </div>

    </div>



    <!-- =====================================

         MEDICINES

    ====================================== -->

    <div id="medicineList"></div>



    <!-- =====================================

         HISTORY

    ====================================== -->

    <div

        id="historyScreen"

        class="history-screen">



        <div class="history-header">

            <div class="history-title">

                История

            </div>



            <div class="history-subtitle">

                Все приёмы лекарств

            </div>

        </div>



        <div class="history-tabs">



            <button

                class="history-tab active"

                onclick="

                    showHistoryPeriod(

                        'today',

                        this

                    )

                ">

                Сегодня

            </button>



            <button

                class="history-tab"

                onclick="

                    showHistoryPeriod(

                        'week',

                        this

                    )

                ">

                7 дней

            </button>



            <button

                class="history-tab"

                onclick="

                    showHistoryPeriod(

                        'month',

                        this

                    )

                ">

                30 дней

            </button>



        </div>



        <div id="historyList"></div>

    </div>



    <!-- =====================================

         ADD MEDICINE

    ====================================== -->

    <!-- STATISTICS -->
    <div id="statisticsScreen" class="statistics-screen">
        <div class="statistics-header">
            <div class="statistics-title">Статистика</div>
            <div class="statistics-subtitle">Соблюдение режима приёма</div>
        </div>
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-card-label">Сегодня</div><div class="stat-card-value" id="statsTodayPercent">0%</div><div class="stat-card-detail" id="statsTodayDetail">0 из 0</div></div>
            <div class="stat-card"><div class="stat-card-label">7 дней</div><div class="stat-card-value" id="statsWeekPercent">0%</div><div class="stat-card-detail" id="statsWeekDetail">0 из 0</div></div>
            <div class="stat-card"><div class="stat-card-label">30 дней</div><div class="stat-card-value" id="statsMonthPercent">0%</div><div class="stat-card-detail" id="statsMonthDetail">0 из 0</div></div>
            <div class="stat-card"><div class="stat-card-label">Принято доз</div><div class="stat-card-value" id="statsTakenTotal">0</div><div class="stat-card-detail" id="statsMissedTotal">0 пропущено</div></div>
        </div>
        <div class="stats-section-title">По лекарствам · 30 дней</div>
        <div id="medicineStatsList"></div>
    </div>

    <button

        class="add-button"

        id="addButton"

        onclick="openModal()">

        ＋ &nbsp; Добавить лекарство

    </button>



</div>





<!-- =====================================

     BOTTOM NAVIGATION

====================================== -->

<div class="bottom-nav">



    <button

        class="nav-button active"

        onclick="showToday()">

        <span class="nav-icon">

            ⌂

        </span>

        Сегодня

    </button>



    <button

        class="nav-button"

        onclick="showStatistics()">

        <span class="nav-icon">

            〽

        </span>

        Статистика

    </button>



    <button

        class="nav-button"

        onclick="showHistory()">

        <span class="nav-icon">

            ◷

        </span>

        История

    </button>



</div>





<!-- =====================================

     MODAL

====================================== -->

<div

    class="modal"

    id="modal">



    <div class="modal-content">



        <div class="modal-handle"></div>



        <div class="modal-header">



            <h2 class="modal-title">

                Новое лекарство

            </h2>



            <button

                class="close-button"

                onclick="closeModal()">

                ×

            </button>

        </div>



        <!-- NAME -->

        <div class="field">

            <label class="field-label">

                Название

            </label>



            <input

                id="medicineName"

                type="text"

                placeholder="Например, Ibuprofen">

        </div>



        <!-- STRENGTH -->

        <div class="field">

            <label class="field-label">

                Дозировка

            </label>



            <input

                id="medicineStrength"

                type="text"

                placeholder="Например, 400 mg">

        </div>



        <!-- ICON -->

        <div class="field">

            <label class="field-label">

                Иконка

            </label>



            <div class="icon-grid">



                <button

                    type="button"

                    class="icon-option selected"

                    data-icon="💊"

                    onclick="selectIcon(this)">

                    💊

                </button>



                <button

                    type="button"

                    class="icon-option"

                    data-icon="🟠"

                    onclick="selectIcon(this)">

                    🟠

                </button>



                <button

                    type="button"

                    class="icon-option"

                    data-icon="🫙"

                    onclick="selectIcon(this)">

                    🫙

                </button>



                <button

                    type="button"

                    class="icon-option"

                    data-icon="💧"

                    onclick="selectIcon(this)">

                    💧

                </button>



                <button

                    type="button"

                    class="icon-option"

                    data-icon="🧴"

                    onclick="selectIcon(this)">

                    🧴

                </button>



                <button

                    type="button"

                    class="icon-option"

                    data-icon="🩹"

                    onclick="selectIcon(this)">

                    🩹

                </button>



                <button

                    type="button"

                    class="icon-option"

                    data-icon="💉"

                    onclick="selectIcon(this)">

                    💉

                </button>



                <button

                    type="button"

                    class="icon-option"

                    data-icon="🥄"

                    onclick="selectIcon(this)">

                    🥄

                </button>



            </div>

        </div>



        <!-- SCHEDULE -->

        <div class="field">



            <label class="field-label">

                Приёмы

            </label>



            <div

                class="schedule-container"

                id="scheduleContainer">



                <div class="schedule">



                    <div class="schedule-top">



                        <input

                            type="time"

                            class="schedule-time">



                        <input

                            type="number"

                            class="schedule-amount"

                            min="0.25"

                            step="0.25"

                            value="1">



                        <span class="unit">

                            шт.

                        </span>



                    </div>



                    <select

                        class="schedule-food">



                        <option value="any">

                            Не зависит от еды

                        </option>



                        <option value="before">

                            До еды

                        </option>



                        <option value="during">

                            Во время еды

                        </option>



                        <option value="after">

                            После еды

                        </option>



                    </select>



                </div>

            </div>



            <button

                type="button"

                class="add-schedule"

                onclick="addSchedule()">

                ＋ Добавить приём

            </button>

        </div>



        <!-- NOTE -->

        <div class="field">



            <label class="field-label">

                Заметка

                <span style="color:#aaa">

                    (необязательно)

                </span>

            </label>



            <textarea

                id="medicineNote"

                placeholder="Например, курс 10 дней"></textarea>

        </div>



        <!-- SAVE -->

        <button

            type="button"

            class="save-button"

            onclick="addMedicine()">

            Сохранить

        </button>



        <button

            type="button"

            class="cancel-button"

            onclick="closeModal()">

            Отмена

        </button>



    </div>

</div>





<script>



/* ========================================

   DATA

======================================== */



let medicines =

    JSON.parse(

        localStorage.getItem(

            "medicines"

        )

    ) || [];



let history =

    JSON.parse(

        localStorage.getItem(

            "history"

        )

    ) || [];



let selectedIcon = "💊";





/* ========================================

   MIGRATION

======================================== */



medicines = medicines.map(

    medicine => {



        if (

            Array.isArray(

                medicine.schedules

            )

        ) {

            return medicine;

        }



        return {

            id:

                medicine.id ||

                Date.now().toString(),

            name:

                medicine.name ||

                "Лекарство",

            strength:

                medicine.strength ||

                medicine.dose ||

                "",

            icon:

                medicine.icon ||

                "💊",

            note:

                medicine.note ||

                "",

            schedules: [

                {

                    id:

                        Date.now()

                        .toString()

                        +

                        "-migrated",

                    time:

                        medicine.time ||

                        "08:00",

                    amount:

                        "1",

                    food:

                        "any"

                }

            ]

        };

    }

);



localStorage.setItem(

    "medicines",

    JSON.stringify(

        medicines

    )

);





/* ========================================

   DATE

======================================== */



function getToday() {

    const now = new Date();

    return now

        .toISOString()

        .split("T")[0];

}





function showDate() {

    const now = new Date();

    document.getElementById(

        "currentDate"

    ).innerText =

        now.toLocaleDateString(

            "ru-RU",

            {

                weekday: "long",

                day: "numeric",

                month: "long"

            }

        );

}





/* ========================================

   SAVE

======================================== */



function saveData() {

    localStorage.setItem(

        "medicines",

        JSON.stringify(

            medicines

        )

    );



    localStorage.setItem(

        "history",

        JSON.stringify(

            history

        )

    );

}





/* ========================================

   FOOD TEXT

======================================== */



function foodText(food) {

    if (

        food === "before"

    ) {

        return "До еды";

    }



    if (

        food === "during"

    ) {

        return "Во время еды";

    }



    if (

        food === "after"

    ) {

        return "После еды";

    }



    return "Не зависит от еды";

}





/* ========================================

   RENDER MEDICINES

======================================== */



function renderMedicines() {

    const list =

        document.getElementById(

            "medicineList"

        );



    list.innerHTML = "";



    let schedules = [];



    medicines.forEach(

        medicine => {

            if (

                !Array.isArray(

                    medicine.schedules

                )

            ) {

                return;

            }



            medicine.schedules.forEach(

                schedule => {

                    schedules.push({

                        medicine,

                        schedule

                    });

                }

            );

        }

    );



    schedules.sort(

        (a, b) =>

            a.schedule.time.localeCompare(

                b.schedule.time

            )

    );



    if (

        schedules.length === 0

    ) {

        list.innerHTML = `

            <div class="empty">

                Пока нет лекарств.<br>

                Добавь первое лекарство ниже.

            </div>

        `;



        updateProgress();

        return;

    }



    schedules.forEach(

        item => {



            const medicine =

                item.medicine;



            const schedule =

                item.schedule;



            const taken =

                history.some(

                    entry =>

                        entry.date ===

                            getToday()

                        &&

                        entry.medicineId ===

                            medicine.id

                        &&

                        entry.scheduleId ===

                            schedule.id

                );



            const card =

                document.createElement(

                    "div"

                );



            card.className =

                "medicine-card"

                +

                (

                    taken

                        ? " completed"

                        : ""

                );



            card.innerHTML = `

                <div class="medicine-icon">

                    ${medicine.icon || "💊"}

                </div>



                <div class="medicine-info">



                    <div class="medicine-time">

                        ${schedule.time}

                    </div>



                    <div class="medicine-name">

                        ${medicine.name}

                    </div>



                    <div class="medicine-dose">

                        ${medicine.strength || ""}

                        ${

                            medicine.strength

                                ? " · "

                                : ""

                        }

                        ${schedule.amount} шт.

                    </div>



                    <div class="medicine-food">

                        🍴

                        ${foodText(

                            schedule.food

                        )}

                    </div>



                </div>



                <button

                    type="button"

                    class="

                        take-button

                        ${

                            taken

                                ? "completed-button"

                                : ""

                        }

                    "

                    onclick="

                        takeMedicine(

                            '${medicine.id}',

                            '${schedule.id}'

                        )

                    "

                >

                    ${

                        taken

                            ? "✓"

                            : "Принять"

                    }

                </button>

            `;



            list.appendChild(

                card

            );

        }

    );



    updateProgress();

}





/* ========================================

   TAKE / UNTAKE MEDICINE

======================================== */



function takeMedicine(

    medicineId,

    scheduleId

) {



    /*

        Ищем, есть ли уже

        запись о сегодняшнем приёме.

    */

    const existingIndex =

        history.findIndex(

            entry =>

                entry.date ===

                    getToday()

                &&

                entry.medicineId ===

                    medicineId

                &&

                entry.scheduleId ===

                    scheduleId

        );



    /*

        Если запись уже существует —

        отменяем приём.

    */

    if (

        existingIndex !== -1

    ) {

        history.splice(

            existingIndex,

            1

        );

    }



    /*

        Если записи нет —

        отмечаем лекарство как принятое.

    */

    else {

        history.push({

            medicineId,

            scheduleId,

            date:

                getToday(),

            time:

                new Date()

                    .toLocaleTimeString(

                        "ru-RU",

                        {

                            hour:

                                "2-digit",

                            minute:

                                "2-digit"

                        }

                    )

        });

    }



    saveData();



    renderMedicines();

    if (document.getElementById("statisticsScreen").style.display !== "none") {
        renderStatistics();
    }


    /*

        Если открыт экран истории —

        обновляем его тоже.

    */

    const historyScreen =

        document.getElementById(

            "historyScreen"

        );



    if (

        historyScreen.style.display !==

        "none"

    ) {

        renderHistory();

    }

}





/* ========================================

   PROGRESS

======================================== */



function updateProgress() {

    let total = 0;

    let taken = 0;



    medicines.forEach(

        medicine => {



            if (

                !Array.isArray(

                    medicine.schedules

                )

            ) {

                return;

            }



            medicine.schedules.forEach(

                schedule => {



                    total++;



                    const wasTaken =

                        history.some(

                            entry =>

                                entry.date ===

                                    getToday()

                                &&

                                entry.medicineId ===

                                    medicine.id

                                &&

                                entry.scheduleId ===

                                    schedule.id

                        );



                    if (

                        wasTaken

                    ) {

                        taken++;

                    }

                }

            );

        }

    );



    document.getElementById(

        "takenCount"

    ).innerText =

        taken;



    document.getElementById(

        "totalCount"

    ).innerText =

        total;



    const percentage =

        total === 0

            ? 0

            :

            Math.round(

                (taken / total) * 100

            );



    document.getElementById(

        "progressPercent"

    ).innerText =

        percentage + "%";



    document.getElementById(

        "progressFill"

    ).style.width =

        percentage + "%";

}





/* ========================================

   ICON

======================================== */



function selectIcon(

    button

) {



    document

        .querySelectorAll(

            ".icon-option"

        )

        .forEach(

            item =>

                item.classList.remove(

                    "selected"

                )

        );



    button.classList.add(

        "selected"

    );



    selectedIcon =

        button.dataset.icon;

}





/* ========================================

   ADD SCHEDULE

======================================== */



function addSchedule() {



    const container =

        document.getElementById(

            "scheduleContainer"

        );



    const div =

        document.createElement(

            "div"

        );



    div.className =

        "schedule";



    div.innerHTML = `

        <div class="schedule-top">



            <input

                type="time"

                class="schedule-time">



            <input

                type="number"

                class="schedule-amount"

                min="0.25"

                step="0.25"

                value="1">



            <span class="unit">

                шт.

            </span>



            <button

                type="button"

                class="remove-schedule"

                onclick="

                    this

                        .closest(

                            '.schedule'

                        )

                        .remove()

                ">

                ×

            </button>



        </div>



        <select

            class="schedule-food">



            <option value="any">

                Не зависит от еды

            </option>



            <option value="before">

                До еды

            </option>



            <option value="during">

                Во время еды

            </option>



            <option value="after">

                После еды

            </option>



        </select>

    `;



    container.appendChild(

        div

    );

}





/* ========================================

   ADD MEDICINE

======================================== */



function addMedicine() {



    const name =

        document

            .getElementById(

                "medicineName"

            )

            .value

            .trim();



    const strength =

        document

            .getElementById(

                "medicineStrength"

            )

            .value

            .trim();



    const note =

        document

            .getElementById(

                "medicineNote"

            )

            .value

            .trim();



    if (

        !name

    ) {

        alert(

            "Введите название лекарства"

        );

        return;

    }



    const timeInputs =

        document.querySelectorAll(

            ".schedule-time"

        );



    const amountInputs =

        document.querySelectorAll(

            ".schedule-amount"

        );



    const foodInputs =

        document.querySelectorAll(

            ".schedule-food"

        );



    const schedules = [];



    for (

        let i = 0;

        i < timeInputs.length;

        i++

    ) {



        if (

            !timeInputs[i].value

        ) {

            alert(

                "Укажите время каждого приёма"

            );

            return;

        }



        schedules.push({

            id:

                Date.now()

                .toString()

                +

                "-"

                +

                i,

            time:

                timeInputs[i].value,

            amount:

                amountInputs[i].value,

            food:

                foodInputs[i].value

        });

    }



    medicines.push({

        id:

            Date.now()

            .toString(),

        name,

        strength,

        icon:

            selectedIcon,

        note,

        schedules

    });



    saveData();



    closeModal();



    renderMedicines();

}





/* ========================================

   MODAL

======================================== */



function openModal() {

    document

        .getElementById(

            "modal"

        )

        .classList.add(

            "active"

        );

}





function closeModal() {

    document

        .getElementById(

            "modal"

        )

        .classList.remove(

            "active"

        );



    document.getElementById(

        "medicineName"

    ).value = "";



    document.getElementById(

        "medicineStrength"

    ).value = "";



    document.getElementById(

        "medicineNote"

    ).value = "";



    document.getElementById(

        "scheduleContainer"

    ).innerHTML = `

        <div class="schedule">



            <div class="schedule-top">



                <input

                    type="time"

                    class="schedule-time">



                <input

                    type="number"

                    class="schedule-amount"

                    min="0.25"

                    step="0.25"

                    value="1">



                <span class="unit">

                    шт.

                </span>



            </div>



            <select

                class="schedule-food">



                <option value="any">

                    Не зависит от еды

                </option>



                <option value="before">

                    До еды

                </option>



                <option value="during">

                    Во время еды

                </option>



                <option value="after">

                    После еды

                </option>



            </select>



        </div>

    `;



    selectedIcon =

        "💊";



    document

        .querySelectorAll(

            ".icon-option"

        )

        .forEach(

            (item, index) => {

                item.classList.toggle(

                    "selected",

                    index === 0

                );

            }

        );

}





/* ========================================

   NAVIGATION

======================================== */



function hideScreens() {

    document.getElementById("medicineList").style.display = "none";
    document.getElementById("historyScreen").style.display = "none";
    document.getElementById("statisticsScreen").style.display = "none";
    document.getElementById("progressCard").style.display = "none";
    document.getElementById("addButton").style.display = "none";

}

function showToday() {

    hideScreens();
    document.getElementById("medicineList").style.display = "block";
    document.getElementById("progressCard").style.display = "block";
    document.getElementById("addButton").style.display = "block";
    setActiveNav(0);

}

function showHistory() {

    hideScreens();
    document.getElementById("historyScreen").style.display = "block";
    setActiveNav(2);
    showHistoryPeriod("today", document.querySelector(".history-tab"));

}

function showStatistics() {

    hideScreens();
    document.getElementById("statisticsScreen").style.display = "block";
    setActiveNav(1);
    renderStatistics();

}

/* ========================================
   STATISTICS
======================================== */

function getStatsForPeriod(days) {
    let planned = 0;
    let taken = 0;

    for (let offset = 0; offset < days; offset++) {
        const dateString = dateKey(dateFromOffset(offset));
        medicines.forEach(medicine => {
            if (!Array.isArray(medicine.schedules)) return;
            medicine.schedules.forEach(schedule => {
                planned++;
                if (history.some(entry =>
                    entry.date === dateString &&
                    entry.medicineId === medicine.id &&
                    entry.scheduleId === schedule.id
                )) taken++;
            });
        });
    }

    return {
        planned,
        taken,
        missed: planned - taken,
        percent: planned === 0 ? 0 : Math.round((taken / planned) * 100)
    };
}

function renderStatistics() {
    const today = getStatsForPeriod(1);
    const week = getStatsForPeriod(7);
    const month = getStatsForPeriod(30);

    document.getElementById("statsTodayPercent").innerText = today.percent + "%";
    document.getElementById("statsTodayDetail").innerText = today.taken + " из " + today.planned + " принято";
    document.getElementById("statsWeekPercent").innerText = week.percent + "%";
    document.getElementById("statsWeekDetail").innerText = week.taken + " из " + week.planned + " принято";
    document.getElementById("statsMonthPercent").innerText = month.percent + "%";
    document.getElementById("statsMonthDetail").innerText = month.taken + " из " + month.planned + " принято";
    document.getElementById("statsTakenTotal").innerText = month.taken;
    document.getElementById("statsMissedTotal").innerText = month.missed + " пропущено";

    const list = document.getElementById("medicineStatsList");
    list.innerHTML = "";

    medicines.forEach(medicine => {
        if (!Array.isArray(medicine.schedules) || medicine.schedules.length === 0) return;

        let planned = 0;
        let taken = 0;

        for (let offset = 0; offset < 30; offset++) {
            const dateString = dateKey(dateFromOffset(offset));
            medicine.schedules.forEach(schedule => {
                planned++;
                if (history.some(entry =>
                    entry.date === dateString &&
                    entry.medicineId === medicine.id &&
                    entry.scheduleId === schedule.id
                )) taken++;
            });
        }

        const percent = planned === 0 ? 0 : Math.round((taken / planned) * 100);
        const item = document.createElement("div");
        item.className = "medicine-stat";
        item.innerHTML = `
            <div class="medicine-stat-icon">${medicine.icon || "💊"}</div>
            <div class="medicine-stat-info">
                <div class="medicine-stat-name">${medicine.name}</div>
                <div class="medicine-stat-detail">${taken} из ${planned} приёмов за 30 дней</div>
                <div class="stat-progress"><div class="stat-progress-fill" style="width:${percent}%"></div></div>
            </div>
            <div class="medicine-stat-percent">${percent}%</div>
        `;
        list.appendChild(item);
    });

    if (medicines.length === 0) {
        list.innerHTML = '<div class="history-empty">Пока нет лекарств.</div>';
    }
}


/* ========================================

   ACTIVE NAV

======================================== */



function setActiveNav(

    index

) {



    const buttons =

        document.querySelectorAll(

            ".nav-button"

        );



    buttons.forEach(

        button =>

            button.classList.remove(

                "active"

            )

    );



    if (

        buttons[index]

    ) {

        buttons[index]

            .classList.add(

                "active"

            );

    }

}





/* ========================================

   HISTORY PERIOD

======================================== */



let currentHistoryPeriod =

    "today";





function showHistoryPeriod(

    period,

    button

) {



    currentHistoryPeriod =

        period;



    document

        .querySelectorAll(

            ".history-tab"

        )

        .forEach(

            tab =>

                tab.classList.remove(

                    "active"

                )

        );



    if (

        button

    ) {

        button.classList.add(

            "active"

        );

    }



    renderHistory();

}





/* ========================================

   DATE OFFSET

======================================== */



function dateFromOffset(

    daysAgo

) {



    const date =

        new Date();



    date.setHours(

        0,

        0,

        0,

        0

    );



    date.setDate(

        date.getDate()

        -

        daysAgo

    );



    return date;

}





function dateKey(

    date

) {



    const year =

        date.getFullYear();



    const month =

        String(

            date.getMonth() + 1

        )

        .padStart(

            2,

            "0"

        );



    const day =

        String(

            date.getDate()

        )

        .padStart(

            2,

            "0"

        );



    return (

        year

        +

        "-"

        +

        month

        +

        "-"

        +

        day

    );

}





/* ========================================

   HISTORY DATE

======================================== */



function formatHistoryDate(

    date

) {



    const today =

        new Date();



    const yesterday =

        dateFromOffset(1);



    if (

        dateKey(date)

        ===

        dateKey(today)

    ) {

        return "Сегодня";

    }



    if (

        dateKey(date)

        ===

        dateKey(yesterday)

    ) {

        return "Вчера";

    }



    return date.toLocaleDateString(

        "ru-RU",

        {

            weekday:

                "long",

            day:

                "numeric",

            month:

                "long"

        }

    );

}





/* ========================================

   RENDER HISTORY

======================================== */



function renderHistory() {



    const list =

        document.getElementById(

            "historyList"

        );



    list.innerHTML = "";



    let days;



    if (

        currentHistoryPeriod

        ===

        "today"

    ) {

        days = 1;

    }

    else if (

        currentHistoryPeriod

        ===

        "week"

    ) {

        days = 7;

    }

    else {

        days = 30;

    }



    let foundAnything =

        false;



    for (

        let offset = 0;

        offset < days;

        offset++

    ) {



        const date =

            dateFromOffset(

                offset

            );



        const dateString =

            dateKey(

                date

            );



        let dayItems = [];



        medicines.forEach(

            medicine => {



                if (

                    !Array.isArray(

                        medicine.schedules

                    )

                ) {

                    return;

                }



                medicine.schedules.forEach(

                    schedule => {



                        const historyEntry =

                            history.find(

                                entry =>

                                    entry.date

                                    ===

                                    dateString

                                    &&

                                    entry.medicineId

                                    ===

                                    medicine.id

                                    &&

                                    entry.scheduleId

                                    ===

                                    schedule.id

                            );



                        dayItems.push({

                            medicine,

                            schedule,

                            historyEntry

                        });

                    }

                );

            }

        );



        if (

            dayItems.length === 0

        ) {

            continue;

        }



        foundAnything =

            true;



        dayItems.sort(

            (a, b) =>

                a.schedule.time.localeCompare(

                    b.schedule.time

                )

        );



        const dayBlock =

            document.createElement(

                "div"

            );



        dayBlock.className =

            "history-day";



        dayBlock.innerHTML = `

            <div class="history-day-title">

                ${formatHistoryDate(

                    date

                )}

            </div>

        `;



        dayItems.forEach(

            item => {



                const medicine =

                    item.medicine;



                const schedule =

                    item.schedule;



                const taken =

                    !!item.historyEntry;



                const historyItem =

                    document.createElement(

                        "div"

                    );



                historyItem.className =

                    "history-item";



                let actualTime;



                if (

                    taken

                ) {

                    actualTime =

                        "Принято в "

                        +

                        item.historyEntry.time;

                }

                else {

                    actualTime =

                        "Не принято";

                }



                historyItem.innerHTML = `

                    <div class="history-icon">

                        ${medicine.icon || "💊"}

                    </div>



                    <div class="history-info">



                        <div class="history-time">

                            ${schedule.time}

                            ·

                            ${actualTime}

                        </div>



                        <div class="history-name">

                            ${medicine.name}

                        </div>



                        <div class="history-dose">

                            ${medicine.strength || ""}

                            ${

                                medicine.strength

                                    ? " · "

                                    : ""

                            }

                            ${schedule.amount} шт.

                        </div>



                    </div>



                    <div

                        class="

                            history-status

                            ${

                                taken

                                    ? "taken"

                                    : "missed"

                            }

                        "

                    >

                        ${

                            taken

                                ? "✓"

                                : "○"

                        }

                    </div>

                `;



                dayBlock.appendChild(

                    historyItem

                );

            }

        );



        list.appendChild(

            dayBlock

        );

    }



    if (

        !foundAnything

    ) {



        list.innerHTML = `

            <div class="history-empty">

                Здесь пока нет истории приёмов.

            </div>

        `;

    }

}





/* ========================================

   START

======================================== */



showDate();

renderMedicines();

showToday();

</script>
